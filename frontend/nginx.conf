server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    client_max_body_size 500m;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Rutas del frontend
  location / {
    try_files $uri /index.html;
  }
}
